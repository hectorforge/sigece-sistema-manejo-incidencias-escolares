spring:
  application:
    name: sigece

  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    validate-on-migrate: false


# Variables entorno del sistema
sigece:
  jwt:
    secret: "Q7mN2xV9kL4pR8sT1wY6zA3bF5hJ0uC9dE2gK7nM4qI=sadaasdsaUISAHJDIUAJSHIUASIUHIAhaskjdha98198129812jiaousd"
    expiration-ms: 28800000        # 8 horas
    refresh-expiration-ms: 86400000 # 24 horas
  cors:
    allowed-origins: "http://localhost:4200"
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "Authorization,Content-Type,X-Requested-With,Accept"
    max-age-secs: 3600

# Configuracion de los logs
logging:
  pattern:
    level: "%5p [traceId: %X{traceId}]"
