spring:
  application:
    name: sigece

  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    validate-on-migrate: false


# Variables entorno del sistema
sigece:
  jwt:
    secret: "TU_CLAVE_SECRETA_SUPER_SEGURA_Y_MUY_LARGA_AQUIASJDSAKDNKN1KJ2NKJN21JKKJJKNKAKJAKJKJASK**SJAIOD8SJ8OIADS"
    expiration-ms: 28800000        # 8 horas
    refresh-expiration-ms: 86400000 # 24 horas
  cors:
    allowed-origins: "http://localhost:4200"
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "Authorization,Content-Type,X-Requested-With,Accept"
    max-age-secs: 3600
